<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">EarnLab compared with Freecash, Scrambly, KashKick, InboxDollars, Swagbucks, Gain.gg, and Gemsloot</title>
  <desc id="desc">Competitor comparison graphic for EarnLab and alternative GPT sites.</desc>
  <rect width="1200" height="560" fill="#f5f5f0"/>
  <text x="70" y="78" fill="#111827" font-family="Arial, sans-serif" font-size="36" font-weight="800">EarnLab vs Competitors</text>
  <rect x="70" y="116" width="1060" height="360" rx="20" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/>
  <g font-family="Arial, sans-serif" font-size="18">
    <rect x="96" y="148" width="230" height="52" rx="10" fill="#ecfccb"/>
    <text x="118" y="181" fill="#365314" font-weight="800">EarnLab</text>
    <rect x="96" y="214" width="230" height="52" rx="10" fill="#f3f4f6"/>
    <text x="118" y="247" fill="#111827" font-weight="700">Freecash</text>
    <rect x="96" y="280" width="230" height="52" rx="10" fill="#f3f4f6"/>
    <text x="118" y="313" fill="#111827" font-weight="700">Scrambly / KashKick</text>
    <rect x="96" y="346" width="230" height="52" rx="10" fill="#f3f4f6"/>
    <text x="118" y="379" fill="#111827" font-weight="700">Swagbucks / InboxDollars</text>
    <rect x="96" y="412" width="230" height="52" rx="10" fill="#f3f4f6"/>
    <text x="118" y="445" fill="#111827" font-weight="700">Gain.gg / Gemsloot</text>
  </g>
  <g fill="#4b5563" font-family="Arial, sans-serif" font-size="18">
    <text x="378" y="181">Broad offerwalls plus optional gamified features</text>
    <text x="378" y="247">Larger mainstream GPT comparison baseline</text>
    <text x="378" y="313">Beginner-friendly app, game, or cash-first alternatives</text>
    <text x="378" y="379">Established rewards ecosystems with many small tasks</text>
    <text x="378" y="445">Useful backup routes for specific game payouts</text>
  </g>
  <g fill="#111827" font-family="Arial, sans-serif" font-size="20" font-weight="800">
    <text x="870" y="181">Best fit: power users</text>
    <text x="870" y="247">Best fit: broad GPT</text>
    <text x="870" y="313">Best fit: beginners</text>
    <text x="870" y="379">Best fit: daily rewards</text>
    <text x="870" y="445">Best fit: offer hunters</text>
  </g>
</svg>
