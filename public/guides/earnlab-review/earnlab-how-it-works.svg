<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">How EarnLab works from signup to offer completion and withdrawal</title>
  <desc id="desc">Flow diagram showing signup, choosing an offer, tracked completion, pending review, and withdrawal.</desc>
  <rect width="1200" height="520" fill="#f5f5f0"/>
  <text x="70" y="78" fill="#111827" font-family="Arial, sans-serif" font-size="36" font-weight="800">How EarnLab Works</text>
  <g fill="#ffffff" stroke="#d1d5db" stroke-width="2">
    <rect x="70" y="132" width="180" height="180" rx="18"/>
    <rect x="290" y="132" width="180" height="180" rx="18"/>
    <rect x="510" y="132" width="180" height="180" rx="18"/>
    <rect x="730" y="132" width="180" height="180" rx="18"/>
    <rect x="950" y="132" width="180" height="180" rx="18"/>
  </g>
  <g fill="none" stroke="#84cc16" stroke-width="8" stroke-linecap="round">
    <path d="M252 222h36"/>
    <path d="M472 222h36"/>
    <path d="M692 222h36"/>
    <path d="M912 222h36"/>
  </g>
  <g fill="#111827" font-family="Arial, sans-serif" font-weight="800" font-size="22">
    <text x="112" y="190">1. Sign up</text>
    <text x="328" y="190">2. Pick task</text>
    <text x="546" y="190">3. Track link</text>
    <text x="760" y="190">4. Review</text>
    <text x="990" y="190">5. Cash out</text>
  </g>
  <g fill="#4b5563" font-family="Arial, sans-serif" font-size="17">
    <text x="100" y="234">Create one account</text>
    <text x="100" y="260">without VPNs or</text>
    <text x="100" y="286">duplicate devices.</text>
    <text x="322" y="234">Read terms, time</text>
    <text x="322" y="260">limits, purchases,</text>
    <text x="322" y="286">and device rules.</text>
    <text x="542" y="234">Start through the</text>
    <text x="542" y="260">tracked EarnLab or</text>
    <text x="542" y="286">offerwall link.</text>
    <text x="762" y="234">Some credit fast;</text>
    <text x="762" y="260">others pend or need</text>
    <text x="762" y="286">advertiser review.</text>
    <text x="986" y="234">Withdraw smaller</text>
    <text x="986" y="260">amounts and keep</text>
    <text x="986" y="286">proof on hand.</text>
  </g>
  <rect x="70" y="362" width="1060" height="82" rx="16" fill="#111827"/>
  <text x="106" y="412" fill="#ecfccb" font-family="Arial, sans-serif" font-size="24" font-weight="800">Core rule: do not spend money unless the reward, deadline, terms, and tracking risk make sense.</text>
</svg>
