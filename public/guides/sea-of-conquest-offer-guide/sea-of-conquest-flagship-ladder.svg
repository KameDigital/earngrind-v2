<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Sea of Conquest Flagship milestone ladder</title>
  <desc id="desc">Original EarnGrind visual showing the Sea of Conquest Flagship milestone ladder from early levels to Flagship 30.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#10151f"/>
      <stop offset="1" stop-color="#172033"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1400" height="820" fill="#f5f5f0"/>
  <rect x="72" y="64" width="1256" height="692" rx="36" fill="#fff" filter="url(#shadow)"/>
  <rect x="72" y="64" width="1256" height="190" rx="36" fill="url(#bg)"/>
  <text x="124" y="130" font-family="Arial, sans-serif" font-size="18" font-weight="900" letter-spacing="4" fill="#a3e635">MILESTONE ROUTE</text>
  <text x="124" y="184" font-family="Arial, sans-serif" font-size="45" font-weight="900" fill="#fff">Flagship levels decide the offer</text>
  <text x="124" y="224" font-family="Arial, sans-serif" font-size="19" fill="#cbd5e1">Most Sea of Conquest tasks pay around Flagship checkpoints. Plan your day around builders, gold, and cabin gates.</text>
  <g transform="translate(128 320)" font-family="Arial, sans-serif">
    <line x1="56" y1="130" x2="1088" y2="130" stroke="#d6dce7" stroke-width="10" stroke-linecap="round"/>
    <g>
      <circle cx="56" cy="130" r="44" fill="#d9ff66" stroke="#111827" stroke-width="8"/>
      <text x="56" y="139" text-anchor="middle" font-size="25" font-weight="900" fill="#111827">6</text>
      <text x="56" y="214" text-anchor="middle" font-size="16" font-weight="900" fill="#111827">12 hours</text>
      <text x="56" y="238" text-anchor="middle" font-size="14" fill="#64748b">Tutorial + first rush</text>
    </g>
    <g transform="translate(172 0)">
      <circle cx="56" cy="130" r="44" fill="#eef8ff" stroke="#111827" stroke-width="8"/>
      <text x="56" y="139" text-anchor="middle" font-size="25" font-weight="900" fill="#111827">11</text>
      <text x="56" y="214" text-anchor="middle" font-size="16" font-weight="900" fill="#111827">Day 2</text>
      <text x="56" y="238" text-anchor="middle" font-size="14" fill="#64748b">Cabin gates begin</text>
    </g>
    <g transform="translate(344 0)">
      <circle cx="56" cy="130" r="44" fill="#fff7ed" stroke="#111827" stroke-width="8"/>
      <text x="56" y="139" text-anchor="middle" font-size="25" font-weight="900" fill="#111827">15</text>
      <text x="56" y="214" text-anchor="middle" font-size="16" font-weight="900" fill="#111827">Day 10</text>
      <text x="56" y="238" text-anchor="middle" font-size="14" fill="#64748b">Gold pressure rises</text>
    </g>
    <g transform="translate(516 0)">
      <circle cx="56" cy="130" r="44" fill="#fdf2f8" stroke="#111827" stroke-width="8"/>
      <text x="56" y="139" text-anchor="middle" font-size="25" font-weight="900" fill="#111827">21</text>
      <text x="56" y="214" text-anchor="middle" font-size="16" font-weight="900" fill="#111827">Day 18-20</text>
      <text x="56" y="238" text-anchor="middle" font-size="14" fill="#64748b">Only efficient loops</text>
    </g>
    <g transform="translate(688 0)">
      <circle cx="56" cy="130" r="44" fill="#ecfeff" stroke="#111827" stroke-width="8"/>
      <text x="56" y="139" text-anchor="middle" font-size="25" font-weight="900" fill="#111827">26</text>
      <text x="56" y="214" text-anchor="middle" font-size="16" font-weight="900" fill="#111827">Late route</text>
      <text x="56" y="238" text-anchor="middle" font-size="14" fill="#64748b">Do not idle builders</text>
    </g>
    <g transform="translate(860 0)">
      <circle cx="56" cy="130" r="54" fill="#111827"/>
      <text x="56" y="141" text-anchor="middle" font-size="31" font-weight="900" fill="#d9ff66">30</text>
      <text x="56" y="214" text-anchor="middle" font-size="16" font-weight="900" fill="#111827">18-28 days</text>
      <text x="56" y="238" text-anchor="middle" font-size="14" fill="#64748b">Highest milestone</text>
    </g>
    <rect x="0" y="310" width="1144" height="84" rx="24" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="32" y="344" font-size="19" font-weight="900" fill="#111827">Offer-rule warning:</text>
    <text x="220" y="344" font-size="17" fill="#526070">Some routes use Flagship level, some say Ship level, and some include purchase milestones.</text>
    <text x="32" y="374" font-size="16" font-weight="800" fill="#65a30d">Open the tracked offer first, screenshot the task list, then follow the exact wording.</text>
  </g>
</svg>
