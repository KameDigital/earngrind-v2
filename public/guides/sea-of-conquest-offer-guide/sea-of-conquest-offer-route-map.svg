<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Sea of Conquest offer route map</title>
  <desc id="desc">Original EarnGrind nautical route map showing the fastest path through Sea of Conquest offer milestones.</desc>
  <defs>
    <linearGradient id="sea" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0f3b4a"/>
      <stop offset="0.55" stop-color="#0f5e6f"/>
      <stop offset="1" stop-color="#092531"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff8dd"/>
      <stop offset="1" stop-color="#f4e3b2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#03131a" flood-opacity="0.24"/>
    </filter>
  </defs>
  <rect width="1400" height="820" fill="#f5f5f0"/>
  <rect x="70" y="58" width="1260" height="704" rx="38" fill="url(#sea)" filter="url(#shadow)"/>
  <path d="M89 218c130-42 214-10 312-32 118-26 193-98 321-56 115 38 187 132 322 83 93-34 177-102 265-63" fill="none" stroke="#8bd6e7" stroke-width="3" opacity=".22"/>
  <path d="M88 560c150-52 245-9 371-35 146-31 240-117 396-62 102 36 160 92 266 62 86-25 139-74 206-61" fill="none" stroke="#8bd6e7" stroke-width="3" opacity=".18"/>
  <g transform="translate(118 108)" font-family="Arial, sans-serif">
    <rect width="1164" height="604" rx="32" fill="url(#paper)" opacity=".98"/>
    <path d="M60 500c160-130 295-196 444-174 113 17 167 88 263 76 125-15 188-135 329-116" fill="none" stroke="#8b5e34" stroke-width="6" stroke-linecap="round" stroke-dasharray="16 18" opacity=".58"/>
    <text x="54" y="72" font-size="18" font-weight="900" letter-spacing="4" fill="#8b5e34">SEA OF CONQUEST OFFER PLAN</text>
    <text x="54" y="126" font-size="44" font-weight="900" fill="#111827">Best path to Flagship milestones</text>
    <text x="54" y="164" font-size="18" fill="#5f4b32">Follow the main quest, upgrade required cabins, farm gold, and only chase side content that feeds the next Flagship level.</text>
    <g transform="translate(72 240)">
      <circle cx="0" cy="0" r="30" fill="#111827"/>
      <text x="0" y="8" text-anchor="middle" font-size="24" font-weight="900" fill="#d9ff66">1</text>
      <rect x="48" y="-42" width="252" height="86" rx="18" fill="#fff" stroke="#d6c291"/>
      <text x="72" y="-10" font-size="19" font-weight="900" fill="#111827">Install cleanly</text>
      <text x="72" y="20" font-size="15" fill="#5f4b32">Use the tracked route first. No prior install.</text>
    </g>
    <g transform="translate(344 380)">
      <circle cx="0" cy="0" r="30" fill="#111827"/>
      <text x="0" y="8" text-anchor="middle" font-size="24" font-weight="900" fill="#d9ff66">2</text>
      <rect x="48" y="-42" width="252" height="86" rx="18" fill="#fff" stroke="#d6c291"/>
      <text x="72" y="-10" font-size="19" font-weight="900" fill="#111827">Rush Flagship</text>
      <text x="72" y="20" font-size="15" fill="#5f4b32">Upgrade only cabins required for the next level.</text>
    </g>
    <g transform="translate(676 444)">
      <circle cx="0" cy="0" r="30" fill="#111827"/>
      <text x="0" y="8" text-anchor="middle" font-size="24" font-weight="900" fill="#d9ff66">3</text>
      <rect x="48" y="-42" width="252" height="86" rx="18" fill="#fff" stroke="#d6c291"/>
      <text x="72" y="-10" font-size="19" font-weight="900" fill="#111827">Farm gold loops</text>
      <text x="72" y="20" font-size="15" fill="#5f4b32">Spend stamina, trade, cook, and keep builders active.</text>
    </g>
    <g transform="translate(930 304)">
      <circle cx="0" cy="0" r="30" fill="#111827"/>
      <text x="0" y="8" text-anchor="middle" font-size="24" font-weight="900" fill="#d9ff66">4</text>
      <rect x="48" y="-42" width="252" height="86" rx="18" fill="#fff" stroke="#d6c291"/>
      <text x="72" y="-10" font-size="19" font-weight="900" fill="#111827">Claim and prove</text>
      <text x="72" y="20" font-size="15" fill="#5f4b32">Screenshot each milestone before moving on.</text>
    </g>
    <g transform="translate(868 108)">
      <path d="M0 80c35-80 114-80 149 0-39-22-110-22-149 0z" fill="#111827"/>
      <rect x="66" y="0" width="16" height="116" rx="8" fill="#111827"/>
      <path d="M82 6c56 18 88 56 92 114-42-26-70-34-92-34z" fill="#d9ff66"/>
      <path d="M63 20c-50 21-78 58-77 113 31-25 57-37 77-39z" fill="#fff"/>
      <rect x="-28" y="114" width="214" height="34" rx="17" fill="#8b5e34"/>
    </g>
  </g>
</svg>
