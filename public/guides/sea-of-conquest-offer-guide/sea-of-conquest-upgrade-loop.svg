<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Sea of Conquest upgrade loop</title>
  <desc id="desc">Original EarnGrind graphic showing the daily upgrade loop for completing Sea of Conquest offer tasks.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="1400" height="820" fill="#f5f5f0"/>
  <rect x="76" y="62" width="1248" height="696" rx="38" fill="#fff" filter="url(#shadow)"/>
  <text x="126" y="132" font-family="Arial, sans-serif" font-size="18" font-weight="900" letter-spacing="4" fill="#65a30d">DAILY COMPLETION LOOP</text>
  <text x="126" y="186" font-family="Arial, sans-serif" font-size="45" font-weight="900" fill="#111827">Repeat this until the next Flagship gate</text>
  <text x="126" y="226" font-family="Arial, sans-serif" font-size="19" fill="#64748b">The fastest path is not random grinding. It is a resource loop that keeps every upgrade dependency moving.</text>
  <g transform="translate(210 310)" font-family="Arial, sans-serif">
    <circle cx="490" cy="190" r="178" fill="#f8fafc" stroke="#e2e8f0" stroke-width="8"/>
    <path d="M490 12a178 178 0 0 1 173 137" fill="none" stroke="#84cc16" stroke-width="18" stroke-linecap="round"/>
    <path d="M663 149a178 178 0 0 1-92 199" fill="none" stroke="#38bdf8" stroke-width="18" stroke-linecap="round"/>
    <path d="M571 348a178 178 0 0 1-221-36" fill="none" stroke="#fb923c" stroke-width="18" stroke-linecap="round"/>
    <path d="M350 312a178 178 0 0 1-12-212" fill="none" stroke="#ec4899" stroke-width="18" stroke-linecap="round"/>
    <text x="490" y="178" text-anchor="middle" font-size="28" font-weight="900" fill="#111827">Flagship</text>
    <text x="490" y="212" text-anchor="middle" font-size="18" font-weight="800" fill="#65a30d">upgrade loop</text>
    <g transform="translate(362 -34)">
      <rect width="256" height="96" rx="22" fill="#f7fee7" stroke="#bef264"/>
      <text x="128" y="38" text-anchor="middle" font-size="20" font-weight="900" fill="#111827">Main quest</text>
      <text x="128" y="66" text-anchor="middle" font-size="15" fill="#526070">Unlock cabins and features</text>
    </g>
    <g transform="translate(694 142)">
      <rect width="276" height="96" rx="22" fill="#eef8ff" stroke="#bae6fd"/>
      <text x="138" y="38" text-anchor="middle" font-size="20" font-weight="900" fill="#111827">Farm stamina</text>
      <text x="138" y="66" text-anchor="middle" font-size="15" fill="#526070">Attack ships you can beat</text>
    </g>
    <g transform="translate(362 318)">
      <rect width="256" height="96" rx="22" fill="#fff7ed" stroke="#fed7aa"/>
      <text x="128" y="38" text-anchor="middle" font-size="20" font-weight="900" fill="#111827">Gold income</text>
      <text x="128" y="66" text-anchor="middle" font-size="15" fill="#526070">Trade, cook, sell, repeat</text>
    </g>
    <g transform="translate(0 142)">
      <rect width="276" height="96" rx="22" fill="#fdf2f8" stroke="#fbcfe8"/>
      <text x="138" y="38" text-anchor="middle" font-size="20" font-weight="900" fill="#111827">Cabin gates</text>
      <text x="138" y="66" text-anchor="middle" font-size="15" fill="#526070">Upgrade only requirements</text>
    </g>
  </g>
  <g transform="translate(126 690)" font-family="Arial, sans-serif">
    <rect width="1148" height="44" rx="22" fill="#111827"/>
    <text x="28" y="29" font-size="15" font-weight="900" fill="#d9ff66">Best click-through note:</text>
    <text x="210" y="29" font-size="15" fill="#e5e7eb">compare live payout first, then start only if your device, country, and time window match.</text>
  </g>
</svg>
