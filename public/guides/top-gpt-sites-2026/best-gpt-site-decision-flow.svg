<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">GPT site decision flow</title>
  <desc id="desc">An original EarnGrind decision flow for choosing the best GPT site based on earning goal.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.17"/>
    </filter>
  </defs>
  <rect width="1400" height="820" fill="#f5f5f0"/>
  <rect x="80" y="66" width="1240" height="688" rx="38" fill="#fff" filter="url(#shadow)"/>
  <rect x="118" y="104" width="1164" height="626" rx="32" fill="#f8fafc"/>
  <rect x="118" y="104" width="1164" height="162" rx="32" fill="url(#bg)"/>
  <text x="164" y="164" font-family="Arial, sans-serif" font-size="18" font-weight="800" letter-spacing="4" fill="#a3e635">CHOOSING A GPT SITE</text>
  <text x="164" y="214" font-family="Arial, sans-serif" font-size="43" font-weight="900" fill="#fff">Start with your earning goal</text>
  <text x="164" y="252" font-family="Arial, sans-serif" font-size="18" fill="#cbd5e1">Then verify live payout terms before clicking any external platform.</text>
  <g transform="translate(170 318)" font-family="Arial, sans-serif">
    <rect x="386" y="0" width="288" height="82" rx="26" fill="#111827"/>
    <text x="530" y="36" text-anchor="middle" font-size="21" font-weight="900" fill="#fff">What matters most?</text>
    <text x="530" y="61" text-anchor="middle" font-size="14" font-weight="700" fill="#a3e635">Choose one path first</text>
    <path d="M530 82v45M240 127h580M240 127v46M530 127v46M820 127v46" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    <g transform="translate(0 174)">
      <rect width="310" height="178" rx="26" fill="#f7fee7" stroke="#bef264"/>
      <text x="28" y="44" font-size="18" font-weight="900" letter-spacing="2" fill="#4d7c0f">HIGHEST UPSIDE</text>
      <text x="28" y="82" font-size="28" font-weight="900" fill="#111827">Offerwall route</text>
      <text x="28" y="116" font-size="16" fill="#526070">Best when you want larger game, app, and milestone payouts.</text>
      <rect x="28" y="134" width="190" height="28" rx="14" fill="#111827"/>
      <text x="123" y="154" text-anchor="middle" font-size="13" font-weight="900" fill="#d9ff66">Freecash / Gain.gg</text>
    </g>
    <g transform="translate(375 174)">
      <rect width="310" height="178" rx="26" fill="#eef8ff" stroke="#bae6fd"/>
      <text x="28" y="44" font-size="18" font-weight="900" letter-spacing="2" fill="#0369a1">SIMPLEST CASH</text>
      <text x="28" y="82" font-size="28" font-weight="900" fill="#111827">Beginner route</text>
      <text x="28" y="116" font-size="16" fill="#526070">Best when you want clear dollars, cashout rules, and low confusion.</text>
      <rect x="28" y="134" width="204" height="28" rx="14" fill="#082f49"/>
      <text x="130" y="154" text-anchor="middle" font-size="13" font-weight="900" fill="#e0f2fe">KashKick / InboxDollars</text>
    </g>
    <g transform="translate(750 174)">
      <rect width="310" height="178" rx="26" fill="#fff7ed" stroke="#fed7aa"/>
      <text x="28" y="44" font-size="18" font-weight="900" letter-spacing="2" fill="#c2410c">LOW FRICTION</text>
      <text x="28" y="82" font-size="28" font-weight="900" fill="#111827">Daily rewards</text>
      <text x="28" y="116" font-size="16" fill="#526070">Best for shopping, surveys, points, and gift-card style rewards.</text>
      <rect x="28" y="134" width="178" height="28" rx="14" fill="#431407"/>
      <text x="117" y="154" text-anchor="middle" font-size="13" font-weight="900" fill="#ffedd5">Swagbucks / MyPoints</text>
    </g>
    <path d="M155 352v43M530 352v43M905 352v43" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    <g transform="translate(0 396)">
      <rect width="1060" height="88" rx="24" fill="#fff" stroke="#e2e8f0"/>
      <text x="32" y="38" font-size="20" font-weight="900" fill="#111827">Final check before you click:</text>
      <text x="286" y="38" font-size="17" fill="#526070">country, device, payout method, tracking rules, time limit, and whether you have installed the app before.</text>
      <text x="32" y="66" font-size="15" font-weight="800" fill="#65a30d">If any one of those fails, pick a different route even if the payout headline is higher.</text>
    </g>
  </g>
</svg>
