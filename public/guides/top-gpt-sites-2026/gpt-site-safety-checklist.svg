<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">GPT site safety checklist board</title>
  <desc id="desc">An original EarnGrind safety board showing the checks to run before starting a GPT offer.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <linearGradient id="ink" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="820" fill="#f5f5f0"/>
  <rect x="82" y="68" width="1236" height="684" rx="38" fill="#fff" filter="url(#shadow)"/>
  <rect x="120" y="108" width="1160" height="150" rx="30" fill="url(#ink)"/>
  <text x="166" y="166" font-family="Arial, sans-serif" font-size="18" font-weight="800" letter-spacing="4" fill="#a3e635">BEFORE YOU CLICK OUT</text>
  <text x="166" y="216" font-family="Arial, sans-serif" font-size="44" font-weight="900" fill="#fff">GPT Offer Safety Checklist</text>
  <g transform="translate(1020 132)" font-family="Arial, sans-serif">
    <rect width="208" height="78" rx="22" fill="#d9ff66"/>
    <text x="104" y="32" text-anchor="middle" font-size="15" font-weight="900" fill="#111827">SAVE PROOF</text>
    <text x="104" y="56" text-anchor="middle" font-size="15" font-weight="900" fill="#111827">CASH OUT EARLY</text>
  </g>
  <g transform="translate(150 310)" font-family="Arial, sans-serif">
    <g>
      <rect width="348" height="150" rx="24" fill="#f7fee7" stroke="#bef264"/>
      <circle cx="48" cy="50" r="22" fill="#84cc16"/>
      <path d="M36 50l9 9 18-24" fill="none" stroke="#111827" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="84" y="45" font-size="23" font-weight="900" fill="#111827">Read the rules</text>
      <text x="84" y="74" font-size="15" fill="#526070">Check country, device, timer,</text>
      <text x="84" y="98" font-size="15" fill="#526070">spend, first-install, and exclusions.</text>
    </g>
    <g transform="translate(398 0)">
      <rect width="348" height="150" rx="24" fill="#eef8ff" stroke="#bae6fd"/>
      <circle cx="48" cy="50" r="22" fill="#38bdf8"/>
      <path d="M36 50l9 9 18-24" fill="none" stroke="#082f49" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="84" y="45" font-size="23" font-weight="900" fill="#111827">Use a clean path</text>
      <text x="84" y="74" font-size="15" fill="#526070">Prior installs, VPNs, emulators,</text>
      <text x="84" y="98" font-size="15" fill="#526070">and duplicate accounts can block credit.</text>
    </g>
    <g transform="translate(796 0)">
      <rect width="348" height="150" rx="24" fill="#fff7ed" stroke="#fed7aa"/>
      <circle cx="48" cy="50" r="22" fill="#fb923c"/>
      <path d="M36 50l9 9 18-24" fill="none" stroke="#431407" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="84" y="45" font-size="23" font-weight="900" fill="#111827">Screenshot everything</text>
      <text x="84" y="74" font-size="15" fill="#526070">Save task terms, account ID,</text>
      <text x="84" y="98" font-size="15" fill="#526070">milestones, and completion screens.</text>
    </g>
    <g transform="translate(0 190)">
      <rect width="348" height="150" rx="24" fill="#fdf2f8" stroke="#fbcfe8"/>
      <circle cx="48" cy="50" r="22" fill="#ec4899"/>
      <path d="M36 50l9 9 18-24" fill="none" stroke="#500724" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="84" y="45" font-size="23" font-weight="900" fill="#111827">Match payout info</text>
      <text x="84" y="74" font-size="15" fill="#526070">PayPal, Venmo, and gift-card</text>
      <text x="84" y="98" font-size="15" fill="#526070">accounts may need consistent details.</text>
    </g>
    <g transform="translate(398 190)">
      <rect width="348" height="150" rx="24" fill="#eef2ff" stroke="#c7d2fe"/>
      <circle cx="48" cy="50" r="22" fill="#818cf8"/>
      <path d="M36 50l9 9 18-24" fill="none" stroke="#312e81" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="84" y="45" font-size="23" font-weight="900" fill="#111827">Avoid bad math</text>
      <text x="84" y="74" font-size="15" fill="#526070">Skip spend-heavy routes unless</text>
      <text x="84" y="98" font-size="15" fill="#526070">the net payout is clearly worth it.</text>
    </g>
    <g transform="translate(796 190)">
      <rect width="348" height="150" rx="24" fill="#ecfeff" stroke="#a5f3fc"/>
      <circle cx="48" cy="50" r="22" fill="#22d3ee"/>
      <path d="M36 50l9 9 18-24" fill="none" stroke="#164e63" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="84" y="45" font-size="23" font-weight="900" fill="#111827">Cash out in stages</text>
      <text x="84" y="74" font-size="15" fill="#526070">Do not leave large balances</text>
      <text x="84" y="98" font-size="15" fill="#526070">sitting longer than necessary.</text>
    </g>
  </g>
  <text x="150" y="716" font-family="Arial, sans-serif" font-size="15" fill="#64748b">EarnGrind note: a GPT platform can be real and still have individual offers that are not worth your time.</text>
</svg>
